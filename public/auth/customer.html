<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบด้วย Discord | KrakenHub</title>
<script>
(function() {
  var q = new URLSearchParams(location.search).get("next") || "/me";
  var CLIENT_ID = "1554520200848875611";
  var REDIRECT_URI = "https://krakenhub-three.vercel.app/api/auth/callback";
  var state = btoa(JSON.stringify({ next: q })).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  var discordUrl = "https://discord.com/api/oauth2/authorize?client_id=" + CLIENT_ID + "&redirect_uri=" + encodeURIComponent(REDIRECT_URI) + "&response_type=code&scope=identify&state=" + state;
  window.location.replace(discordUrl);
})();
</script>
<style>
body {
  background: #060606;
  color: #eee;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: grid;
  place-items: center;
  min-height: 100vh;
  margin: 0;
}
.box {
  text-align: center;
  padding: 24px;
}
.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid rgba(255,255,255,.15);
  border-top-color: #22c55e;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
h2 {
  font-size: 18px;
  font-weight: 600;
  margin: 0 0 8px;
}
p {
  color: #888;
  font-size: 14px;
  margin: 0;
}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h2>กำลังเชื่อมต่อไปยัง Discord...</h2>
  <p>Connecting to Discord...</p>
</div>
</body>
</html>
