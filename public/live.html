<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Live | Script Vault</title>
<script src="/theme.js?default=dark"></script>
<script src="/live-dark.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/live.css">
<script src="/w/back.js" defer></script></head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
</svg>

<div class="stage"><canvas id="globe" aria-label="Interactive globe showing where users are"></canvas></div>

<header class="topbar">
  <div class="tb-l">
    <a class="icon-btn" href="/" title="ย้อนกลับ" aria-label="ย้อนกลับ"><svg class="i"><use href="#i-arrow-left"/></svg></a>
    <span class="tb-title">Live</span>
    <span class="pill" id="pill"><i class="d"></i><span id="pillt">Connecting</span></span>
    <span class="pill viewers" id="viewers" hidden><svg class="i"><use href="#i-eye"/></svg><span id="viewers-n">0</span><span class="vt" id="viewers-t"> คนอื่นดูอยู่</span></span>
  </div>
  <div class="tb-r">
    <select class="input sel" id="proj" aria-label="เลือกโปรเจกต์"></select>
    <button class="btn ghost sm" id="demo" aria-pressed="false"><svg class="i"><use href="#i-play"/></svg><span>Demo</span></button>
    <button class="btn ghost sm" id="setup"><svg class="i"><use href="#i-terminal"/></svg><span>Setup</span></button>
    <button class="icon-btn" id="theme" title="สลับธีม" aria-label="สลับธีม"></button>
  </div>
</header>

<main class="ui">
  <aside class="col left">
    <section class="card hero">
      <div class="lbl">ออนไลน์ตอนนี้</div>
      <div class="big num" id="big">0</div>
      <div class="delta" id="delta"></div>
      <div class="stats">
        <div class="stat"><b class="num" id="s-peak">0</b><span>สูงสุดใน 24 ชม.</span></div>
        <div class="stat"><b class="num" id="s-maps">0</b><span>แมพที่เล่นอยู่</span></div>
        <div class="stat"><b class="num" id="s-ctry">0</b><span>ประเทศ</span></div>
        <div class="stat"><b class="num" id="s-srv">0</b><span>เซิร์ฟเวอร์</span></div>
      </div>
    </section>
    <section class="card">
      <div class="ct"><span>Activity</span>
        <div class="seg" id="range"><button data-r="60" class="on">1h</button><button data-r="360">6h</button><button data-r="1440">24h</button></div></div>
      <div class="chart" id="chartbox"><svg id="chart"></svg><div class="ctip" id="ctip"></div></div>
    </section>
    <section class="card grow">
      <div class="ct"><span>Countries</span><span class="muted" id="ctry-n"></span></div>
      <div class="scroll" id="ctry"></div>
    </section>
  </aside>

  <aside class="col right">
    <section class="card grow">
      <div class="ct"><span>Maps</span><span class="muted" id="maps-n"></span></div>
      <div class="scroll" id="maps"></div>
    </section>
    <section class="card feed">
      <div class="ct"><span>Recent</span><span class="muted">เข้าและออกล่าสุด</span></div>
      <div class="scroll" id="events"></div>
    </section>
  </aside>
</main>

<div class="nodata" id="nodata">
  <b>ยังไม่มีผู้ใช้ออนไลน์</b>
  <span>ติดตั้งโค้ดติดตามในสคริปต์ หรือดูตัวอย่างหน้าตาด้วยข้อมูลจำลอง</span>
  <div><button class="btn sm" id="nd-setup">วิธีติดตั้ง</button><button class="btn ghost sm" id="nd-demo">ดูตัวอย่าง</button></div>
</div>
<div class="hintbar" id="hintbar">ลากเพื่อหมุน เลื่อนเพื่อซูม คลิกจุดเพื่อโฟกัส</div>
<div class="tip" id="tip"></div>
<div id="toasts" aria-live="polite"></div>
<script src="/land.js"></script>
<script src="/live.js"></script>
</body>
</html>
